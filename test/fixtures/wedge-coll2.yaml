name: unprovided-coll
title: unprovided input collection deadlock
description: collection variant with an independently blocked terminal step

inputs:
  - name: brief
    seedOwed: false
  - name: contract
    seedOwed: true

steps:
  - name: gather
    consumes: [brief]
    produces: ["gather.item[]"]
    body: |
      emit then seal
  - name: work
    consumes: [contract]
    produces: [outcome]
    terminal: true
