# Software-delivery wiring — a TEACHING EXAMPLE, not a production workflow.
#
# This file exists to show the engine's core dynamics in the fewest possible
# steps. It is NOT the delivery line this project's authors actually run, and
# it is not a copy of any deployed definition. The real one is a separately
# published workflow bundle named `owenloop-delivery`: an order of magnitude
# larger, with provisioner/deprovisioner lifecycle steps, a merge gate, mentor
# consults, capability routing and run modifiers. For an in-repo definition
# shaped like a real production line, read `ship.yaml` next door.
#
# What this one teaches: a linear pipeline where each step consumes the
# previous one's output and owes the next. The interesting dynamics are the
# *knock-backs* — the reviewer can reject the PR (re-arming the builder), and
# any upstream change cascades forward: a re-planned `plan` invalidates the
# `pr`, its `verdict`, and the `merge` automatically (the forward cascade, §7).
# The `merge` is terminal: once green it is a destructive completion and can
# never be re-armed (§15.2).
#
# Drive it (play every Step Agent yourself):
#   export OWENLOOP_DEFS=examples/workflows
#   export OWENLOOP_DB=/tmp/owenloop-delivery-demo.db
#
#   wf=$(owenloop create delivery --provide proposal='{"text":"add dark mode"}' | jq -r .workflow)
#   run=$(owenloop tick $wf | jq -r '.orders[0].run')   # -> the `planner` order
#   owenloop green $wf $run plan --value '{"plan":"..."}'
#   owenloop close $wf $run
#   ...                        # tick/green/close down the chain
#   owenloop reject $wf pr --by reviewer --text "tests missing"   # knock-back
#   owenloop status $wf        # done / debts / eligible / blocked / pending / inFlight

name: delivery
title: Software delivery (teaching example)
description: >-
  Plan → build → review → merge, with reviewer knock-backs. A minimal wiring
  written to teach the engine's dynamics — not the production delivery line
  (that is the separately published `owenloop-delivery` bundle); see ship.yaml
  for a production-shaped definition.
outputs: [merge]

inputs:
  - name: proposal          # required: the workflow stays blocked until supplied
    seedOwed: true          # `--provide proposal=...` at create, or `owenloop provide`

steps:
  - name: planner
    consumes: [proposal]
    produces: [plan]
    body: |
      Workflow ${WORKFLOW}, run ${RUN}.
      Read the proposal and produce a concrete implementation plan as `plan`.

  - name: builder
    consumes: [plan]
    produces: [pr]
    maxAttempts: 5            # builders get re-armed a lot by reviewer rejects
    body: |
      Workflow ${WORKFLOW}, run ${RUN}.
      Implement `plan` and open a PR. Green `pr` with the PR url.
      If `pr` already carries reject reasons, address them and re-green.

  - name: reviewer
    consumes: [pr]
    produces: [verdict]
    body: |
      Workflow ${WORKFLOW}, run ${RUN}.
      Review `pr`. If it is not mergeable, `reject` pr with a reason (this
      re-arms the builder). Otherwise green `verdict` with your approval.

  - name: merger
    consumes: [verdict]
    produces: [merge]
    terminal: true           # a merge is a destructive completion
    body: |
      Workflow ${WORKFLOW}, run ${RUN}.
      The verdict is approval. Merge the PR and green `merge` (terminal).
