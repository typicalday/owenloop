name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels an in-flight run for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 (active LTS) and 24 (current). Both ship native TS type-stripping
        # unflagged, which the test/typecheck scripts rely on.
        node: [22, 24]
    name: check (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: bash .dev/checks.sh

  # Real SSHSIG interoperability: both OS runners ship stock `ssh-keygen` with
  # `-Y` support, so the crypto tests run unskipped — module sign → stock
  # verify and stock sign → module verify in both directions, plus the secure
  # file-backend fallback (ubuntu has no `secret-tool` service in CI; macOS
  # Keychain is never touched — storage adapters stay hermetic via fakes).
  crypto-interop:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    name: crypto interop (${{ matrix.os }})
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run test:crypto

  bundle-vector:
    name: bundle golden vector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest] }
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - { uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444, with: { node-version: 22, cache: npm } } # v5.0.0

      - run: npm ci
      - run: npm run build
      - run: node --test test/bundle.test.ts
